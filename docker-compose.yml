version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pizzaria_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: pizzaria_checklist
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pizzaria_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/pizzaria_checklist
      SECRET_KEY: ${SECRET_KEY:-pizzaria-secret-key-change-in-production}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: pizzaria_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8001/api/v1
      WS_BASE_URL: ws://backend:8001
      MEDIA_BASE_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8001}
      WEB_MODE: "1"
      WEB_PORT: "8082"
    ports:
      - "${FRONTEND_PORT:-8082}:8082"

volumes:
  postgres_data:
  uploads_data:
